name: Hardening gates

# Read-only verification of the Warden service contract against a real,
# genuinely isolated systemd user manager on Linux. The only permission is
# contents:read.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  service-lifecycle:
    # The lifecycle exercise boots its own isolated systemd user manager on a
    # private HOME/XDG_CONFIG_HOME/XDG_RUNTIME_DIR and D-Bus session bus. A
    # GitHub-hosted runner cannot host a second systemd user manager next to
    # its ambient one, so the whole exercise runs inside a dedicated systemd
    # container: the container's own PID-1 systemd is the only system manager,
    # the exercise's user manager boots cleanly there, and nothing on the host
    # runner (or any developer machine) is ever touched.
    runs-on: ubuntu-latest
    steps:
      # Pinned to the same immutable commit SHAs trusted by ci.yml and release.yml.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
          cache: true
      - name: build warden binary
        run: |
          mkdir -p "$HOME/.warden-lifecycle-bin"
          go build -trimpath -o "$HOME/.warden-lifecycle-bin/warden" ./cmd/warden
      - name: build isolated systemd container image
        run: |
          mkdir -p "$RUNNER_TEMP/sysd"
          printf '%s\n' \
            'FROM ubuntu:24.04' \
            'RUN apt-get update -o Acquire::Retries=5 && apt-get install -y --no-install-recommends -o Acquire::Retries=5 systemd systemd-sysv dbus && rm -f /usr/sbin/policy-rc.d' \
            'CMD ["/sbin/init"]' \
            > "$RUNNER_TEMP/sysd/Dockerfile"
          set +e
          out=$(docker build -t warden-sysd-ubuntu "$RUNNER_TEMP/sysd" 2>&1)
          code=$?
          if [ $code -ne 0 ]; then
            printf '%s\n' "$out" | sed 's/^/::error::/' | tail -30
            exit $code
          fi
          printf '%s\n' "$out" | tail -3
          docker run --rm warden-sysd-ubuntu bash -c 'command -v systemd-analyze && command -v dbus-daemon && test -x /sbin/init' \
            || { echo "systemd tooling missing from image" >&2; exit 1; }
      - name: start isolated systemd container
        run: |
          set +e
          out=$(docker run -d --name "warden-lc-${{ github.run_id }}" \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            warden-sysd-ubuntu 2>&1)
          code=$?
          if [ $code -ne 0 ]; then
            printf '%s\n' "$out" | sed 's/^/::error::/'
            exit $code
          fi
          for _i in $(seq 1 90); do
            docker exec "warden-lc-${{ github.run_id }}" systemctl is-system-running >/dev/null 2>&1 && break
            sleep 1
          done
          if ! docker exec "warden-lc-${{ github.run_id }}" systemctl is-system-running >/dev/null 2>&1; then
            docker logs --tail 60 "warden-lc-${{ github.run_id }}" 2>&1 | sed 's/^/::error::/'
            exit 1
          fi
          # The system manager needs its system D-Bus bus for user managers to
          # register with PID 1; ensure it is up before the lifecycle runs.
          docker exec "warden-lc-${{ github.run_id }}" bash -c \
            "systemctl start dbus.socket dbus.service 2>/dev/null || true"
          if ! docker exec "warden-lc-${{ github.run_id }}" test -S /run/dbus/system_bus_socket; then
            docker logs --tail 60 "warden-lc-${{ github.run_id }}" 2>&1 | sed 's/^/::error::/'
            exit 1
          fi
          docker exec "warden-lc-${{ github.run_id }}" bash -c "useradd -m -s /bin/bash warden"
          docker cp "$HOME/.warden-lifecycle-bin/warden" "warden-lc-${{ github.run_id }}":/opt/warden
          docker cp "$GITHUB_WORKSPACE/tests/service-lifecycle.sh" "warden-lc-${{ github.run_id }}":/opt/service-lifecycle.sh
      - name: real systemd service lifecycle (isolated container)
        run: |
          set +e
          out=$(docker exec -u warden \
            -e WARDEN_LIFECYCLE_BIN=/opt/warden \
            -e HOME=/home/warden \
            "warden-lc-${{ github.run_id }}" bash /opt/service-lifecycle.sh 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            printf '%s\n' "$out" | sed 's/^/::error::/'
          fi
          exit $code
      - name: teardown isolated container
        if: always()
        run: docker rm -f "warden-lc-${{ github.run_id }}" >/dev/null 2>&1 || true
      - name: git diff --check
        run: git diff --check