name: Hardening gates

# Read-only verification of the Warden service contract against a real,
# genuinely isolated systemd user manager on Linux. The only permission is
# contents:read.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  service-lifecycle:
    # Best-effort, non-blocking. The lifecycle exercise always boots its own
    # isolated systemd user manager on a private HOME/XDG_CONFIG_HOME/
    # XDG_RUNTIME_DIR and D-Bus session bus, so a developer's real Warden
    # binary, unit, service and data are never touched. That genuinely
    # isolated exercise requires a host that can host an additional systemd
    # user manager (a real Linux machine or a systemd-capable self-hosted
    # runner). GitHub-hosted runners cannot boot a second user manager next to
    # their ambient one, so this job fails there by design and is therefore
    # non-blocking (continue-on-error); the renderer and lifecycle logic remain
    # fully verified by the unit suite (which runs real systemd-analyze --user
    # verify) in ci.yml and by the local/manual run of tests/service-lifecycle.sh.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # Pinned to the same immutable commit SHAs trusted by ci.yml and release.yml.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
          cache: true
      - name: install systemd analyze tooling
        run: |
          if ! command -v systemd-analyze >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y systemd-analyze
          fi
      - name: build warden binary
        run: |
          mkdir -p "$HOME/.warden-lifecycle-bin"
          go build -trimpath -o "$HOME/.warden-lifecycle-bin/warden" ./cmd/warden
      - name: real systemd service lifecycle
        run: |
          set +e
          out=$(sh tests/service-lifecycle.sh 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            printf '%s\n' "$out" | sed 's/^/::error::/'
          fi
          exit $code
      - name: git diff --check
        run: git diff --check