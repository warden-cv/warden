name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v4.2.2, pinned after BH16 review.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v5.0.0, pinned after BH16 review.
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: |
          go test ./...
          go vet ./...
          node tests/markdown-render-smoke.js
          node tests/frontend-security-smoke.js
          scripts/git-history-hygiene.sh
      - name: Build and inspect six release targets
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: scripts/build-release.sh
      - name: Upload immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/warden-* dist/checksums.txt --clobber
