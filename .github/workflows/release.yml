name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
          node tests/agent-ux.test.js
          node tests/editor-layout.test.js
          node tests/reload-guard.test.js
          node tests/session-navigation.test.js
          node tests/markdown-render-smoke.js
          node tests/frontend-security-smoke.js
          scripts/workflow-contract.sh
          scripts/git-history-hygiene.sh
      - name: Build and verify six archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          case "$GITHUB_REF_NAME" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "tag must be vMAJOR.MINOR.PATCH" >&2; exit 1;; esac
          scripts/build-release.sh
          (cd dist && sha256sum -c checksums.txt)
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with: {name: release-assets, path: 'dist/*'}
  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: {name: release-assets, path: dist}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.0
        with: {subject-path: 'dist/*'}
  publish:
    needs: attest
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: {name: release-assets, path: dist}
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
